name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nimbalodge
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: nimbalodge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nimbalodge -d nimbalodge_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Secrets jetables, valables uniquement pour la durée du run CI (base Postgres éphémère,
    # recréée à chaque exécution) — même logique que .env.test.example (non commité mais son
    # contenu est un gabarit public), jamais réutilisés en dev/prod.
    env:
      DATABASE_URL: postgresql://nimbalodge:ci-test-password@localhost:5432/nimbalodge_test?schema=public
      NODE_ENV: test
      CORS_ORIGIN: http://localhost:5174
      JWT_ACCESS_SECRET: ci-access-secret-do-not-use-outside-automated-tests
      JWT_REFRESH_SECRET: ci-refresh-secret-do-not-use-outside-automated-tests
      JWT_2FA_CHALLENGE_SECRET: ci-2fa-challenge-secret-do-not-use-outside-automated-tests
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      API_PORT: 4001

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Apply migrations to the test database
        run: npx prisma migrate deploy --schema=prisma/schema.prisma

      - name: Typecheck (apps/api, apps/web)
        run: npm run typecheck

      - name: Typecheck (apps/api test files)
        run: npm run typecheck:test -w @nimbalodge/api

      - name: Build API
        run: npm run build:api

      - name: Build web
        run: npm run build:web

      - name: API unit tests
        run: npm run test:api:unit

      - name: API e2e tests
        run: npx jest --config apps/api/test/jest-e2e.json --runInBand
