name: Database Backup

on:
  schedule:
    # 03:00 UTC quotidien — heure creuse (le fuseau des utilisateurs vises, Guinee, est UTC+0).
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest

    # Base ephemere pour VERIFIER que la sauvegarde se restaure vraiment, pas seulement qu'un
    # fichier a ete produit — une sauvegarde jamais restauree n'est pas une sauvegarde fiable.
    services:
      restore-check:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nimbalodge
          POSTGRES_PASSWORD: restore-check-password
          POSTGRES_DB: nimbalodge_restore_check
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nimbalodge -d nimbalodge_restore_check"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Dump production database
        env:
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          if [ -z "$PROD_DATABASE_URL" ]; then
            echo "::error::Secret PROD_DATABASE_URL manquant — voir docs/deployment/database-backup.md"
            exit 1
          fi
          mkdir -p backup
          STAMP="$(date -u +%Y-%m-%dT%H-%M-%SZ)"
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"
          # Image postgres:16-alpine (pas le client apt de l'image du runner) pour garantir une
          # version de pg_dump alignee sur le serveur (voir docker-compose.yml / render.yaml).
          # --no-owner/--no-privileges : dump portable, restaurable sous un role different de
          # "nimbalodge" sans erreurs GRANT/OWNER.
          docker run --rm postgres:16-alpine pg_dump --no-owner --no-privileges "$PROD_DATABASE_URL" \
            > "backup/nimbalodge-$STAMP.sql"

      - name: Verify the dump actually restores
        run: |
          gzip -k "backup/nimbalodge-$STAMP.sql"
          PGPASSWORD=restore-check-password psql -h localhost -U nimbalodge -d nimbalodge_restore_check \
            -v ON_ERROR_STOP=1 -f "backup/nimbalodge-$STAMP.sql" > /dev/null
          COUNT=$(PGPASSWORD=restore-check-password psql -h localhost -U nimbalodge -d nimbalodge_restore_check \
            -tAc "SELECT count(*) FROM pg_tables WHERE schemaname = 'public';")
          echo "Tables restaurées lors de la vérification : $COUNT"
          if [ "$COUNT" -lt 1 ]; then
            echo "::error::La restauration de vérification n'a produit aucune table — sauvegarde suspecte, investiguer avant de faire confiance à cet artifact."
            exit 1
          fi
          rm "backup/nimbalodge-$STAMP.sql"

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: nimbalodge-backup-${{ env.STAMP }}
          path: backup/nimbalodge-${{ env.STAMP }}.sql.gz
          retention-days: 30
